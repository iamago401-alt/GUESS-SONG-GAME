<template>
  <!-- 1. 房間主容器：綁定 roomBgColor 動態變更背景色 -->
  <div class="room-container" :style="{ backgroundColor: roomBgColor }">
    
    <!-- 頂部列 / 房間資訊 -->
    <header class="room-header">
      <h2>房間名稱：大亂鬥測試房</h2>
      <button class="icon-btn" @click="showSettings = true">⚙️ 設定</button>
    </header>

    <!-- 遊戲主要內容區域 -->
    <main class="game-area">
      <p>遊戲內容區域（目前背景色：{{ roomBgColor }}）</p>
    </main>

    <!-- 2. 設定面板 Modal 彈窗 -->
    <div v-if="showSettings" class="modal-overlay" @click.self="showSettings = false">
      <!-- 面板主體：綁定 modalBgColor (白底或黑底) -->
      <div class="setting-modal" :style="{ backgroundColor: modalBgColor, color: isDarkMode ? '#ffffff' : '#333333' }">
        <div class="modal-header">
          <h3>遊戲設定</h3>
          <button class="close-btn" @click="showSettings = false">✕</button>
        </div>

        <div class="modal-body">
          <!-- 自定義房間背景顏色 (調色盤) -->
          <div class="setting-item">
            <label>房間背景顏色：</label>
            <div class="color-picker-group">
              <input type="color" v-model="roomBgColor" />
              <span>{{ roomBgColor }}</span>
            </div>
          </div>

          <!-- 設定面板主題切換 (白底 / 黑底) -->
          <div class="setting-item">
            <label>設定面板風格：</label>
            <button class="theme-btn" @click="toggleModalTheme">
              切換為 {{ isDarkMode ? '亮色 (白底)' : '暗色 (黑底)' }}
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</template>

<script>
export default {
  name: 'GameRoom',
  data() {
    return {
      showSettings: false,       // 控制設定面板顯示/隱藏
      roomBgColor: '#4a90e2',    // 房間預設背景色 (藍色系)
      isDarkMode: false          // 設定面板是否為黑底
    }
  },
  computed: {
    // 根據深色模式切換設定面板底色
    modalBgColor() {
      return this.isDarkMode ? '#1e1e1e' : '#ffffff';
    }
  },
  methods: {
    toggleModalTheme() {
      this.isDarkMode = !this.isDarkMode;
    }
  }
}
</script>

<style scoped>
/* 房間全螢幕佈局 */
.room-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background-color 0.3s ease; /* 變換顏色時有平滑漸變效果 */
  box-sizing: border-box;
}

.room-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 20px;
  background-color: rgba(0, 0, 0, 0.2); /* 標題列半透明黑色，適合各種背景色 */
  color: white;
}

.icon-btn {
  padding: 8px 16px;
  font-size: 16px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  background: white;
  color: #333;
}

.game-area {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

/* Modal 遮罩層 */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.5); /* 半透明背景遮罩 */
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

/* 2. 設定面板 (核心重點) */
.setting-modal {
  width: 360px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  transition: background-color 0.3s ease, color 0.3s ease;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(150, 150, 150, 0.2);
  padding-bottom: 10px;
  margin-bottom: 20px;
}

.close-btn {
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: inherit;
}

.setting-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.color-picker-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* 調色盤樣式優化 */
input[type="color"] {
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  background: none;
}

.theme-btn {
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 6px;
  border: 1px solid #ccc;
  background: transparent;
  color: inherit;
}
</style>
