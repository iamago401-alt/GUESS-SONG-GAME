<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猜歌小遊戲 - 歌詞猜謎完整版</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 15px; width: 100%; max-width: 360px; padding: 20px;
    }
    .hidden { display: none !important; }
    .input-group { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 16px; }
    input[type="text"], textarea {
      flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid #444;
      background-color: #222; color: #fff; font-size: 16px; outline: none; width: 100%;
    }
    input[type="text"]:focus, textarea:focus { border-color: #1db954; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background-color: #1db954; color: white; font-size: 18px; font-weight: bold;
      cursor: pointer; transition: background-color 0.2s;
    }
    button:hover { background-color: #1ed760; }
    button:disabled { background-color: #555; cursor: not-allowed; }
    button.secondary { background-color: #333; }
    button.secondary:hover { background-color: #444; }

    /* 房間大廳 layout */
    #room-view {
      width: 100%; max-width: 900px; min-height: 90vh; display: flex; flex-direction: column;
      gap: 15px; padding: 15px; background-color: rgba(18, 18, 18, 0.9); border-radius: 12px;
    }
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.4);
    }
    .back-btn { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; width: auto; padding: 0; }
    
    .room-main-content { display: flex; gap: 15px; flex-wrap: wrap; }
    .room-left { flex: 2; min-width: 280px; display: flex; flex-direction: column; gap: 15px; }
    .room-right { flex: 1; min-width: 220px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; }

    .players-container {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      padding: 10px; background-color: rgba(255, 255, 255, 0.05); border-radius: 8px; max-height: 250px; overflow-y: auto;
    }
    .player-card {
      position: relative; background-color: rgba(255, 255, 255, 0.1); border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 6px; padding: 10px; display: flex; align-items: center; justify-content: space-between; height: 45px;
    }
    .player-card.active { background-color: rgba(29, 185, 84, 0.2); border: 1px solid #1db954; }
    .kick-btn { background: none; border: none; color: #ff4d4d; font-size: 16px; font-weight: bold; cursor: pointer; width: auto; }

    .settings-container { padding: 15px; border-radius: 8px; background-color: #1e1e1e; display: flex; flex-direction: column; gap: 12px; }
    .setting-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .setting-title { font-weight: bold; min-width: 100px; }
    .range-group { display: flex; align-items: center; gap: 10px; flex: 1; }
    .range-group input[type="range"] { flex: 1; }

    /* 勝場榜樣式 */
    .win-board-title { font-size: 18px; font-weight: bold; color: #ffd700; margin-bottom: 10px; text-align: center; }
    .win-board-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .win-board-item { display: flex; justify-content: space-between; padding: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* Modal 通用彈窗 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .modal-box {
      background-color: #222; border: 1px solid #444; border-radius: 12px; padding: 25px;
      width: 90%; max-width: 450px; text-align: center; display: flex; flex-direction: column; gap: 15px;
    }

    /* 遊戲主畫面 */
    #game-view {
      width: 100%; max-width: 600px; min-height: 80vh; display: flex; flex-direction: column;
      align-items: center; justify-content: space-between; padding: 20px; background: #1e1e1e; border-radius: 12px;
    }
    .timer-display { font-size: 32px; font-weight: bold; color: #ff4d4d; }
    .lyrics-box {
      width: 100%; min-height: 120px; background: #121212; border: 1px solid #444; border-radius: 8px;
      padding: 15px; font-size: 20px; text-align: center; display: flex; align-items: center; justify-content: center;
    }
    .scores-header { display: flex; gap: 15px; font-size: 14px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>

  <!-- 1. 主選單 -->
  <div id="main-screen" class="screen">
    <button id="start-btn">開始</button>
    <button id="about-btn" class="secondary">關於</button>
  </div>

  <!-- 2. 進入房間選單 -->
  <div id="room-screen" class="screen hidden">
    <div class="input-group">
      <label>請輸入名字：</label>
      <input type="text" id="username" value="玩家1">
    </div>
    <button id="create-room-btn">創建房間</button>
    <button id="join-room-btn" class="secondary">加入房間</button>
  </div>

  <!-- 3. 輸入代碼頁 -->
  <div id="join-code-screen" class="screen hidden">
    <div class="input-group">
      <label>房間代碼：</label>
      <input type="text" id="room-code-input" maxlength="6" style="text-transform: uppercase;">
    </div>
    <div id="join-error-msg" style="color:red; font-size:14px;"></div>
    <button id="submit-code-btn">確定進入</button>
    <button id="back-to-room-screen-btn" class="secondary">返回</button>
  </div>

  <!-- 4. 房間大廳 -->
  <div id="room-view" class="hidden">
    <div class="top-bar">
      <button class="back-btn" id="leave-room-btn">↩</button>
      <div>👥 <span id="current-players">1</span>/<span id="max-players">16</span></div>
      <div>代碼：<span id="room-code-text">******</span> <button id="toggle-code-btn" style="width:auto; padding:2px 6px; font-size:12px;">顯示</button></div>
    </div>

    <div class="room-main-content">
      <div class="room-left">
        <div class="players-container" id="players-list"></div>

        <div class="settings-container">
          <button id="main-action-btn">開始遊戲</button>

          <div class="setting-row">
            <span class="setting-title">模式：</span>
            <button style="flex:1;" class="active">歌詞猜謎</button>
          </div>

          <div class="setting-row">
            <span class="setting-title">人數上限：</span>
            <div class="range-group">
              <input type="range" id="player-limit-range" min="2" max="16" value="16">
              <span id="player-limit-val">16</span>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-title">獲勝分數：</span>
            <div class="range-group">
              <input type="range" id="win-score-range" min="1" max="20" value="5">
              <span id="win-score-val">5分</span>
            </div>
          </div>

          <!-- 歌詞猜謎專用設定 -->
          <div class="setting-row">
            <span class="setting-title">出題時間：</span>
            <div class="range-group">
              <input type="range" id="maker-time-range" min="30" max="90" step="5" value="30">
              <span id="maker-time-val">30秒</span>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-title">猜題時間：</span>
            <div class="range-group">
              <input type="range" id="guess-time-range" min="60" max="120" step="5" value="60">
              <span id="guess-time-val">60秒</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側：房間累積勝場榜 -->
      <div class="room-right">
        <div class="win-board-title">🏆 房間累積勝場榜</div>
        <ul class="win-board-list" id="win-board-list">
          <li style="text-align:center; opacity:0.5;">尚無戰績</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 5. 玩法介紹 Modal -->
  <div id="intro-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>歌詞猜謎 - 玩法介紹</h2>
      <p style="text-align: left; line-height: 1.6; font-size:15px;">
        由一位玩家擔任<b>出題者</b>，寫下歌曲的歌詞與正確歌名。<br>
        其餘玩家為<b>猜題者</b>，需在時間內搶答歌名。<br>
        最先打出正確答案者獲得 1 分！率先達到指定分數者獲得最終勝利！
      </p>
      <button id="confirm-intro-btn">確認 (<span id="ready-count">0</span>/<span id="total-count">0</span>)</button>
    </div>
  </div>

  <!-- 6. 遊戲進行主畫面 -->
  <div id="game-view" class="hidden">
    <div class="scores-header" id="game-scores-header"></div>
    
    <div class="timer-display" id="game-timer">--</div>

    <!-- 出題者介面 -->
    <div id="maker-panel" class="hidden" style="width:100%; display:flex; flex-direction:column; gap:10px;">
      <h3>👑 你是出題者，請出題：</h3>
      <input type="text" id="maker-ans-input" placeholder="請輸入正確歌名（答案）">
      <textarea id="maker-lyrics-input" rows="4" placeholder="請輸入歌詞題目"></textarea>
      <button id="submit-question-btn">送出題目</button>
    </div>

    <!-- 猜題者介面 -->
    <div id="guesser-panel" class="hidden" style="width:100%; display:flex; flex-direction:column; gap:15px; align-items:center;">
      <div id="guesser-status" style="font-size:18px; color:#ffd700;">等待出題者出題中...</div>
      <div class="lyrics-box" id="display-lyrics">歌詞將顯示於此</div>
      <div style="width:100%; display:flex; gap:8px;">
        <input type="text" id="guess-input" placeholder="請輸入答案並按 Enter 或點擊送出" disabled>
        <button id="submit-guess-btn" style="width:100px;" disabled>搶答</button>
      </div>
    </div>
  </div>

  <!-- 7. 單局結算排行榜 Modal -->
  <div id="result-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>🎉 遊戲結束 - 最終結算</h2>
      <div id="leaderboard-list" style="display:flex; flex-direction:column; gap:8px; text-align:left;"></div>
      <button id="back-to-room-btn">返回房間</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, update, onValue, off, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQU8dwFwXaogwRdDsnNHHyYKbxxxTifJY",
      authDomain: "gurss-song.firebaseapp.com",
      databaseURL: "https://gurss-song-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gurss-song",
      storageBucket: "gurss-song.firebasestorage.app",
      messagingSenderId: "1014713355425",
      appId: "1:1014713355425:web:28b99f79f57029fd38b4e0",
      measurementId: "G-7D2V0WBDKS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentActiveRoomCode = "";
    let isCodeVisible = false;
    let isHost = true;
    let myPlayerName = "";
    let activePlayers = [];
    let roomListenerRef = null;
    let isSelfLeaving = false;
    let timerInterval = null;

    // DOM 元素
    const mainScreen = document.getElementById('main-screen');
    const roomScreen = document.getElementById('room-screen');
    const joinCodeScreen = document.getElementById('join-code-screen');
    const roomView = document.getElementById('room-view');
    const gameView = document.getElementById('game-view');
    const introModal = document.getElementById('intro-modal');
    const resultModal = document.getElementById('result-modal');

    const leaveRoomBtn = document.getElementById('leave-room-btn');
    const startBtn = document.getElementById('start-btn');
    const createRoomBtn = document.getElementById('create-room-btn');
    const joinRoomBtn = document.getElementById('join-room-btn');
    const submitCodeBtn = document.getElementById('submit-code-btn');
    const mainActionBtn = document.getElementById('main-action-btn');
    const confirmIntroBtn = document.getElementById('confirm-intro-btn');
    const submitQuestionBtn = document.getElementById('submit-question-btn');
    const submitGuessBtn = document.getElementById('submit-guess-btn');
    const backToRoomBtn = document.getElementById('back-to-room-btn');

    const playerLimitRange = document.getElementById('player-limit-range');
    const winScoreRange = document.getElementById('win-score-range');
    const makerTimeRange = document.getElementById('maker-time-range');
    const guessTimeRange = document.getElementById('guess-time-range');

    // 工具函式
    function generateRoomCode() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      let code = "";
      for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
      return code;
    }

    function cleanString(str) {
      return (str || "").toLowerCase().replace(/\s+/g, '');
    }

    // 事件：拉條綁定
    playerLimitRange.addEventListener('input', (e) => {
      document.getElementById('player-limit-val').innerText = e.target.value;
      if (isHost && currentActiveRoomCode) update(ref(db, `rooms/${currentActiveRoomCode}`), { maxPlayers: parseInt(e.target.value) });
    });
    winScoreRange.addEventListener('input', (e) => {
      document.getElementById('win-score-val').innerText = e.target.value + "分";
      if (isHost && currentActiveRoomCode) update(ref(db, `rooms/${currentActiveRoomCode}`), { winScore: parseInt(e.target.value) });
    });
    makerTimeRange.addEventListener('input', (e) => {
      document.getElementById('maker-time-val').innerText = e.target.value + "秒";
      if (isHost && currentActiveRoomCode) update(ref(db, `rooms/${currentActiveRoomCode}`), { makerTime: parseInt(e.target.value) });
    });
    guessTimeRange.addEventListener('input', (e) => {
      document.getElementById('guess-time-val').innerText = e.target.value + "秒";
      if (isHost && currentActiveRoomCode) update(ref(db, `rooms/${currentActiveRoomCode}`), { guessTime: parseInt(e.target.value) });
    });

    // 進入房間畫面處理
    function showRoomSelectionScreen() {
      if (roomListenerRef) { off(roomListenerRef); roomListenerRef = null; }
      currentActiveRoomCode = "";
      mainScreen.classList.add('hidden');
      joinCodeScreen.classList.add('hidden');
      gameView.classList.add('hidden');
      introModal.classList.add('hidden');
      resultModal.classList.add('hidden');
      roomView.classList.add('hidden');
      roomScreen.classList.remove('hidden');
    }

    leaveRoomBtn.addEventListener('click', () => {
      if (confirm("您確定要離開房間嗎？")) leaveRoom();
    });

    async function leaveRoom() {
      isSelfLeaving = true;
      const targetRoomCode = currentActiveRoomCode;
      showRoomSelectionScreen();
      if (targetRoomCode) {
        activePlayers = activePlayers.filter(p => p.name !== myPlayerName);
        if (activePlayers.length > 0) {
          if (isHost) activePlayers[0].isHost = true;
          await update(ref(db, `rooms/${targetRoomCode}`), { players: activePlayers });
        } else {
          await set(ref(db, `rooms/${targetRoomCode}`), null);
        }
      }
    }

    // 監聽房間資料
    function listenToRoom(roomCode) {
      if (roomListenerRef) off(roomListenerRef);
      roomListenerRef = ref(db, `rooms/${roomCode}`);

      onValue(roomListenerRef, (snapshot) => {
        if (isSelfLeaving) return;
        if (snapshot.exists()) {
          const roomData = snapshot.val();
          activePlayers = roomData.players || [];

          if (!activePlayers.some(p => p.name === myPlayerName)) {
            alert("您已被踢出房間");
            showRoomSelectionScreen();
            return;
          }

          // 同步選單設定
          if (!isHost) {
            playerLimitRange.value = roomData.maxPlayers || 16;
            document.getElementById('player-limit-val').innerText = playerLimitRange.value;
            winScoreRange.value = roomData.winScore || 5;
            document.getElementById('win-score-val').innerText = winScoreRange.value + "分";
            makerTimeRange.value = roomData.makerTime || 30;
            document.getElementById('maker-time-val').innerText = makerTimeRange.value + "秒";
            guessTimeRange.value = roomData.guessTime || 60;
            document.getElementById('guess-time-val').innerText = guessTimeRange.value + "秒";
          }

          renderPlayers();
          renderWinBoard(roomData.winBoard || {});
          handleGameState(roomData);
        } else {
          alert("房間已解散");
          showRoomSelectionScreen();
        }
      });
    }

    function renderPlayers() {
      const list = document.getElementById('players-list');
      list.innerHTML = "";
      document.getElementById('current-players').innerText = activePlayers.length;
      document.getElementById('max-players').innerText = playerLimitRange.value;

      activePlayers.forEach((player, index) => {
        const card = document.createElement('div');
        card.className = 'player-card active';
        card.innerHTML = `<span>${player.isHost ? '👑 ' : ''}${player.name}</span>`;
        if (isHost && !player.isHost) {
          const kickBtn = document.createElement('button');
          kickBtn.className = 'kick-btn';
          kickBtn.innerText = '❌';
          kickBtn.onclick = () => {
            activePlayers.splice(index, 1);
            update(ref(db, `rooms/${currentActiveRoomCode}`), { players: activePlayers });
          };
          card.appendChild(kickBtn);
        }
        list.appendChild(card);
      });
    }

    function renderWinBoard(winBoard) {
      const list = document.getElementById('win-board-list');
      list.innerHTML = "";
      const sorted = Object.entries(winBoard).sort((a, b) => b[1] - a[1]);
      if (sorted.length === 0) {
        list.innerHTML = `<li style="text-align:center; opacity:0.5;">尚無戰績</li>`;
        return;
      }
      sorted.forEach(([name, count]) => {
        const li = document.createElement('li');
        li.className = 'win-board-item';
        li.innerHTML = `<span>${name}</span><span style="color:#ffd700; font-weight:bold;">${count} 勝</span>`;
        list.appendChild(li);
      });
    }

    // 創建與加入房間
    createRoomBtn.addEventListener('click', async () => {
      myPlayerName = document.getElementById('username').value.trim() || "玩家1";
      currentActiveRoomCode = generateRoomCode();
      isHost = true;
      isSelfLeaving = false;
      activePlayers = [{ name: myPlayerName, isHost: true, score: 0, introReady: false }];

      await set(ref(db, `rooms/${currentActiveRoomCode}`), {
        code: currentActiveRoomCode,
        maxPlayers: parseInt(playerLimitRange.value),
        winScore: parseInt(winScoreRange.value),
        makerTime: parseInt(makerTimeRange.value),
        guessTime: parseInt(guessTimeRange.value),
        gameState: 'LOBBY',
        players: activePlayers
      });

      listenToRoom(currentActiveRoomCode);
      roomScreen.classList.add('hidden');
      roomView.classList.remove('hidden');
    });

    joinRoomBtn.addEventListener('click', () => {
      roomScreen.classList.add('hidden');
      joinCodeScreen.classList.remove('hidden');
    });

    submitCodeBtn.addEventListener('click', async () => {
      const code = document.getElementById('room-code-input').value.trim().toUpperCase();
      myPlayerName = document.getElementById('username').value.trim() || "玩家2";
      if (!code) return;

      const snapshot = await get(child(ref(db), `rooms/${code}`));
      if (snapshot.exists()) {
        const roomData = snapshot.val();
        if (roomData.players.length >= (roomData.maxPlayers || 16)) {
          document.getElementById('join-error-msg').innerText = "房間已滿！";
          return;
        }
        isHost = false;
        isSelfLeaving = false;
        currentActiveRoomCode = code;

        if (roomData.players.some(p => p.name === myPlayerName)) {
          myPlayerName += "_" + Math.floor(Math.random() * 100);
        }
        activePlayers = [...roomData.players, { name: myPlayerName, isHost: false, score: 0, introReady: false }];
        await update(ref(db, `rooms/${code}`), { players: activePlayers });

        listenToRoom(code);
        joinCodeScreen.classList.add('hidden');
        roomView.classList.remove('hidden');
      } else {
        document.getElementById('join-error-msg').innerText = "找不到房間！";
      }
    });

    // 開始遊戲與玩法確認
    mainActionBtn.addEventListener('click', async () => {
      if (!isHost) return;
      if (activePlayers.length < 2) {
        alert("至少需要 2 名玩家才能開始遊戲！");
        return;
      }
      // 初始化遊戲狀態
      const updatedPlayers = activePlayers.map(p => ({ ...p, score: 0, introReady: false }));
      const makerIdx = Math.floor(Math.random() * updatedPlayers.length);

      await update(ref(db, `rooms/${currentActiveRoomCode}`), {
        gameState: 'INTRO',
        players: updatedPlayers,
        currentMakerIndex: makerIdx,
        roundCount: 1
      });
    });

    confirmIntroBtn.addEventListener('click', async () => {
      confirmIntroBtn.disabled = true;
      const playerRef = ref(db, `rooms/${currentActiveRoomCode}`);
      await runTransaction(playerRef, (roomData) => {
        if (roomData && roomData.players) {
          const my = roomData.players.find(p => p.name === myPlayerName);
          if (my) my.introReady = true;
        }
        return roomData;
      });
    });

    // 處理遊戲核心狀態切換
    function handleGameState(roomData) {
      const state = roomData.gameState;

      if (state === 'LOBBY') {
        roomView.classList.remove('hidden');
        gameView.classList.add('hidden');
        introModal.classList.add('hidden');
        resultModal.classList.add('hidden');
      } 
      else if (state === 'INTRO') {
        roomView.classList.add('hidden');
        introModal.classList.remove('hidden');
        
        const readyCount = roomData.players.filter(p => p.introReady).length;
        document.getElementById('ready-count').innerText = readyCount;
        document.getElementById('total-count').innerText = roomData.players.length;

        // 全員準備完成，由房主觸發進入出題階段
        if (isHost && readyCount === roomData.players.length) {
          update(ref(db, `rooms/${currentActiveRoomCode}`), {
            gameState: 'MAKING_QUESTION',
            endTime: Date.now() + (roomData.makerTime * 1000)
          });
        }
      } 
      else if (state === 'MAKING_QUESTION') {
        introModal.classList.add('hidden');
        gameView.classList.remove('hidden');
        renderScoresHeader(roomData.players);

        const currentMaker = roomData.players[roomData.currentMakerIndex];
        const isMaker = currentMaker.name === myPlayerName;

        startTimer(roomData.endTime, () => {
          if (isHost) startCountdownAndGuess(roomData, "超時未出題，自動跳過", "");
        });

        if (isMaker) {
          document.getElementById('maker-panel').classList.remove('hidden');
          document.getElementById('guesser-panel').classList.add('hidden');
        } else {
          document.getElementById('maker-panel').classList.add('hidden');
          document.getElementById('guesser-panel').classList.remove('hidden');
          document.getElementById('guesser-status').innerText = `👑 正在等待出題者 [${currentMaker.name}] 出題...`;
          document.getElementById('display-lyrics').innerText = "???";
          document.getElementById('guess-input').disabled = true;
          submitGuessBtn.disabled = true;
        }
      }
      else if (state === 'COUNTDOWN') {
        document.getElementById('maker-panel').classList.add('hidden');
        document.getElementById('guesser-panel').classList.remove('hidden');
        document.getElementById('guesser-status').innerText = "題目已出好！準備倒數搶答！";
        document.getElementById('display-lyrics').innerText = "3 秒後公開歌詞...";
        startTimer(roomData.endTime, () => {
          if (isHost) {
            update(ref(db, `rooms/${currentActiveRoomCode}`), {
              gameState: 'GUESSING',
              endTime: Date.now() + (roomData.guessTime * 1000)
            });
          }
        });
      }
      else if (state === 'GUESSING') {
        renderScoresHeader(roomData.players);
        const currentMaker = roomData.players[roomData.currentMakerIndex];
        const isMaker = currentMaker.name === myPlayerName;

        document.getElementById('guesser-status').innerText = "🔥 搶答開始！請快速打出歌名：";
        document.getElementById('display-lyrics').innerText = roomData.currentLyrics || "(無歌詞)";

        if (!isMaker) {
          document.getElementById('guess-input').disabled = false;
          submitGuessBtn.disabled = false;
        } else {
          document.getElementById('guesser-status').innerText = "👑 你是出題者，正在觀看玩家搶答...";
          document.getElementById('guess-input').disabled = true;
          submitGuessBtn.disabled = true;
        }

        startTimer(roomData.endTime, () => {
          if (isHost) nextRound(roomData, "時間到！無人答對，公布答案：" + roomData.currentAnswer);
        });
      }
      else if (state === 'ENDED') {
        gameView.classList.add('hidden');
        resultModal.classList.remove('hidden');
        renderLeaderboard(roomData.players);
      }
    }

    // 出題者提交題目
    submitQuestionBtn.addEventListener('click', async () => {
      const ans = document.getElementById('maker-ans-input').value.trim();
      const lyrics = document.getElementById('maker-lyrics-input').value.trim();

      if (!ans || !lyrics) {
        alert("答案與歌詞皆不能為空！");
        return;
      }

      await update(ref(db, `rooms/${currentActiveRoomCode}`), {
        currentAnswer: ans,
        currentLyrics: lyrics,
        gameState: 'COUNTDOWN',
        endTime: Date.now() + 3000
      });

      document.getElementById('maker-ans-input').value = "";
      document.getElementById('maker-lyrics-input').value = "";
    });

    // 搶答提交
    async function checkGuess() {
      const guess = document.getElementById('guess-input').value.trim();
      if (!guess) return;

      const roomSnap = await get(ref(db, `rooms/${currentActiveRoomCode}`));
      const roomData = roomSnap.val();
      if (roomData.gameState !== 'GUESSING') return;

      if (cleanString(guess) === cleanString(roomData.currentAnswer)) {
        document.getElementById('guess-input').value = "";
        // 正確答對，以 Transaction 防止多人同毫秒搶答
        await runTransaction(ref(db, `rooms/${currentActiveRoomCode}`), (room) => {
          if (room && room.gameState === 'GUESSING') {
            room.gameState = 'ROUND_OVER';
            const winner = room.players.find(p => p.name === myPlayerName);
            if (winner) winner.score += 1;
          }
          return room;
        });

        alert(`恭喜你答對了！獲得 1 分！`);
        const updatedSnap = await get(ref(db, `rooms/${currentActiveRoomCode}`));
        nextRound(updatedSnap.val(), `🎉 ${myPlayerName} 答對了！答案是：${roomData.currentAnswer}`);
      } else {
        alert("答案不正確，再試一次！");
        document.getElementById('guess-input').value = "";
      }
    }

    submitGuessBtn.addEventListener('click', checkGuess);
    document.getElementById('guess-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkGuess();
    });

    // 輪流下一輪或判斷獲勝者
    async function nextRound(roomData, announceMsg) {
      alert(announceMsg);

      // 檢查是否有人達到獲勝分數
      const winScore = roomData.winScore || 5;
      const winner = roomData.players.find(p => p.score >= winScore);

      if (winner) {
        // 遊戲結束
        const winBoard = roomData.winBoard || {};
        winBoard[winner.name] = (winBoard[winner.name] || 0) + 1;

        await update(ref(db, `rooms/${currentActiveRoomCode}`), {
          gameState: 'ENDED',
          winBoard: winBoard
        });
      } else {
        // 下一位出題者
        let nextMakerIdx = (roomData.currentMakerIndex + 1) % roomData.players.length;
        await update(ref(db, `rooms/${currentActiveRoomCode}`), {
          gameState: 'MAKING_QUESTION',
          currentMakerIndex: nextMakerIdx,
          endTime: Date.now() + ((roomData.makerTime || 30) * 1000)
        });
      }
    }

    // 倒數計時器
    function startTimer(endTime, onComplete) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remain = Math.ceil((endTime - Date.now()) / 1000);
        if (remain <= 0) {
          clearInterval(timerInterval);
          document.getElementById('game-timer').innerText = "0s";
          if (onComplete) onComplete();
        } else {
          document.getElementById('game-timer').innerText = remain + "s";
        }
      }, 200);
    }

    function renderScoresHeader(players) {
      const header = document.getElementById('game-scores-header');
      header.innerHTML = players.map(p => `<div>${p.name}: <b>${p.score || 0}分</b></div>`).join(" | ");
    }

    function renderLeaderboard(players) {
      const list = document.getElementById('leaderboard-list');
      list.innerHTML = "";
      const sorted = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));

      sorted.forEach((p, idx) => {
        const div = document.createElement('div');
        div.style.cssText = "display:flex; justify-content:space-between; padding:8px; background:#333; border-radius:4px;";
        div.innerHTML = `<span>第 ${idx + 1} 名：${p.name}</span><b>${p.score || 0} 分</b>`;
        list.appendChild(div);
      });
    }

    backToRoomBtn.addEventListener('click', async () => {
      confirmIntroBtn.disabled = false;
      if (isHost) {
        await update(ref(db, `rooms/${currentActiveRoomCode}`), {
          gameState: 'LOBBY'
        });
      }
    });

    startBtn.addEventListener('click', () => {
      mainScreen.classList.add('hidden');
      roomScreen.classList.remove('hidden');
    });

    document.getElementById('about-btn').addEventListener('click', () => {
      alert('製作者：墨寒\n協助者：gemini\n信箱：shn20060401@gmail.com');
    });

    document.getElementById('back-to-room-screen-btn').addEventListener('click', () => {
      joinCodeScreen.classList.add('hidden');
      roomScreen.classList.remove('hidden');
    });

    document.getElementById('toggle-code-btn').addEventListener('click', () => {
      isCodeVisible = !isCodeVisible;
      document.getElementById('room-code-text').innerText = isCodeVisible ? currentActiveRoomCode : "******";
      document.getElementById('toggle-code-btn').innerText = isCodeVisible ? "隱藏" : "顯示";
    });
  </script>
</body>
</html>
